name: Agentic Insurance Fleet CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-and-test:
    name: Verify 5-Pillar Architecture & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Module Compilation Check
        run: |
          python -m py_compile app.py agents/*.py flows/*.py infrastructure/*.py ui/*.py

      - name: Run 5-Pillar Automated Test Suite
        env:
          ADK_OFFLINE_MODE: "1"
          ENV: "LOCAL"
        run: |
          python -m unittest discover -s tests -v

      - name: Validate Container Build
        run: |
          docker build -t insurance-fleet:ci-test .
